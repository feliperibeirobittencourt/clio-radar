name: Debug temporário — estrutura de vendedor na Estante Virtual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar diagnóstico
        run: node scripts/debug-estante-seller.mjs

      - name: Publicar debug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/estante-seller.txt
          git commit -m "Debug temporário: estrutura de vendedor na Estante Virtual" || echo "Nada novo"
          git pull --rebase origin main
          git push origin HEAD:main
