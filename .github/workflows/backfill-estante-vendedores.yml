name: Preencher vendedor no histórico da Estante Virtual

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Máximo de anúncios a processar nesta rodada (vazio = todos os pendentes)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: clio-estante-scrape
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar vendedor dos anúncios já existentes no histórico
        env:
          ESTANTE_BACKFILL_LIMIT: ${{ inputs.limite }}
        run: node scripts/backfill-estante-vendedores.mjs

      - name: Publicar histórico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add raw/estante-historico.csv raw/estante-vendedores.json

          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi

          git commit -m "Preenche vendedor no histórico da Estante Virtual"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Tentativa $i de publicar falhou (provável conflito com outra atualização em andamento). Tentando novamente…"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Não foi possível publicar após 5 tentativas."
          exit 1

      - name: Acionar reconstrução dos dados do CLIO (leilões + Estante Virtual)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-clio-data.yml --ref main
